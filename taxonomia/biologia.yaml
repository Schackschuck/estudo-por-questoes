# Árvore de conceitos — Botânica.
# Regras (spec v0.2, seção 5):
#   - id é chave, não rótulo: nunca renomeie, nunca reaproveite.
#   - três níveis abaixo da disciplina: raiz > subárea > folha.
#   - para pendurar a MESMA tag em outro ramo, repita só o id (sem "nome").
#     Isso é referência, não duplicata — a tentativa guarda o id, não o caminho.
#   - diagnostica: false para vocabulário que não deve entrar no cálculo
#     de domínio nem na trilha.
disciplina: Biologia — Botânica
versao: "0.2"

arvore:

