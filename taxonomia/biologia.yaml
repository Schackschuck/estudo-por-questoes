# ================================================ RAMO TRANSVERSAL (seção 5)
# As folhas aqui são as MESMAS de cima, penduradas também neste ramo. Serve
# para a agregação por ancestral responder "você troca os caracteres
# diagnósticos" em vez de espalhar o erro por dois ramos distantes.
- id: bio.caracteres_diagnosticos
  nome: Caracteres diagnósticos (pares que se confundem)
  # Ramo transversal: reúne folhas que já vivem nos ramos temáticos. Não é uma
  # seção do conteúdo programático, é uma lente sobre ele — por isso a triagem
  # varre por ramo temático e não conta uma visita aqui como cobertura.
  transversal: true
  filhos:

  - id: bio.cd_nervacao
